[workspace]
resolver = "2"
members = [
    "crates/bundle",
    "crates/common",
    "crates/comms",
    "crates/ground",
    "crates/orbital",
    "crates/routing",
    "crates/satellite",
    "crates/telemetry",
    "binaries/hsrn-ground",
    "binaries/hsrn-sat",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3"
authors = ["Jair Ramos jayramos@duck.com"]

[workspace.dependencies]
# async runtime
tokio = { version = "1.49.0", features = ["full"] }

# serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "1.0.2+spec-1.1.0"

# logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }

# time handling
chrono = { version = "0.4.43", features = ["serde"] }

# math
nalgebra = { version =  "0.34.1", features = ["serde", "serde-serialize"] }

# error handling
thiserror = "2.0.18"
anyhow = "1.0.101"

# bundle protocol
bp7 = "0.10.7"

# testing
proptest = "1.10.0"
criterion = "0.8.2"

# utilities
uuid = { version = "1.21.0", features = ["serde", "v4"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
incremental = true